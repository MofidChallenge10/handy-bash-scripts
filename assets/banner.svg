<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-label="handy-bash-scripts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="170" rx="14" fill="url(#bg)"/>
  <circle cx="28" cy="26" r="6" fill="#ef4444"/>
  <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="26" r="6" fill="#22c55e"/>
  <text x="40" y="95" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="30" fill="#e2e8f0">$ handy-bash-scripts</text>
  <rect x="402" y="70" width="14" height="30" fill="#38bdf8">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="137" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#38bdf8" opacity="0">
    extract · backup · killport · sysinfo · cleanup
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
